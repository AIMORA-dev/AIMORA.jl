name: Public package CI

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-open-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - name: Prove solver content is absent
        run: |
          test ! -e src/solvers
          test -z "$(git ls-files src/solvers)"
      - name: Check and test the open core
        run: make check test
