name: Public package CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-open-core:
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    uses: AIMORA-dev/.github/.github/workflows/julia-smoke.yml@c4eea2f0d3237419875db67a8c8d8752fce790cd
    with:
      julia-version: ${{ matrix.julia-version }}
      test-command: |
        test ! -e src/solvers
        test -z "$(git ls-files src/solvers)"
        make check test
