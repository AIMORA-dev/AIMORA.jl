name: Public package CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-open-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - name: Prove solver content is absent
        run: |
          test ! -f src/solvers/nodal.jl
          test ! -f src/solvers/timestep.jl
      - name: Check and test the open core
        run: make check test
      - name: Check tracked solver boundary
        run: |
          if git ls-files src/solvers | grep -v '^src/solvers$'; then
            echo "Public history contains files below the private solver gitlink."
            exit 1
          fi
